services:
  - type: web
    name: magical-athlete-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MINIAPP_SECRET
        sync: false
      - key: DB_PATH
        value: /var/data/magical_athlete.db
    disk:
      name: magical-athlete-data
      mountPath: /var/data
      sizeGB: 1
